<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature's Platter</title>
    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>


    <header class="bg-[#FEFEFD]">
        <nav class="grid grid-cols-3 gap-4 pt-4 justify-center container mx-auto ">
            <img src="./assets/nav-logo.png" alt="" class="w-[120px] h-auto">

            <ul class="flex gap-4 items-center mx-auto">
                <li>Product</li>
                <li>Services</li>
                <li>Contact us</li>
            </ul>
            <div class="flex gap-4 items-center mx-auto ">
                <span><i class="fa-solid fa-magnifying-glass"></i></span>
                <span><i class="fa-solid fa-cart-shopping"></i></span>
                <button class="rounded border border-green-500 font-semibold px-3
                py-1">Login</button>
                <button class="rounded bg-green-500 text-white font-semibold px-3
                py-1">Register</button>
            </div>
        </nav>
        <section class="text-center py-[20px]">
            <div class="max-w-[60%] mx-auto">
                <h2 class="font-bold text-4xl mb-4">Freshness <span class="text-[#179800]">You Can <br>Count</span> On,
                    Prices You’ll Love!</h2>
                <p>Shop your daily essentials at unbeatable prices. From fresh produce to pantry staples, we’ve got you
                    covered every day!</p>
            </div>
            <img src="assets/Hero Section 1.png" alt="" class="mx-auto mx-w-[830px] h-auto">
        </section>
    </header>
    <!-- Services -->
    <section>
        <h2 class="bg-[#179800] font-bold text-4xl mb-3">Services</h2>
    </section>
</body>

</html>
